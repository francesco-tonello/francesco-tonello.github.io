<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio 5.0 / Shape Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;700&family=Archivo:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f1ec;
    --ink: #0f0f0f;
    --mid: #7a7570;
    --rule: #d8d3cc;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr;
  }

  header {
    grid-column: 1 / -1;
    padding: 28px 40px 24px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 20px;
  }

  header h1 {
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
  }

  header span {
    font-size: 12px;
    color: var(--mid);
    letter-spacing: 0.06em;
  }

  .controls {
    padding: 36px 32px;
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
  }

  .controls-title {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 28px;
  }

  .value-row {
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
  }

  .value-row:first-of-type { border-top: 1px solid var(--rule); }

  .value-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .value-name {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .value-num {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    min-width: 36px;
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 1px;
    background: var(--ink);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    background: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.5); }

  .controls-footer {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--ink);
    padding: 12px 20px;
    transition: background 0.15s, color 0.15s;
  }

  button.primary { background: var(--ink); color: var(--bg); }
  button.primary:hover { background: #2a2a2a; }
  button.secondary { background: transparent; color: var(--ink); }
  button.secondary:hover { background: var(--ink); color: var(--bg); }

  .canvas-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
    position: relative;
  }

  #logo-svg {
    width: min(480px, 80%);
    height: min(480px, 80%);
  }

  .regen-note {
    margin-top: 24px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--mid);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <h1>Laboratorio 5.0 / Shape Generator</h1>
</header>

<aside class="controls">
  <p class="controls-title">Scala</p>

  <div class="value-row">
    <div class="value-label">
      <span class="value-name">Scala</span>
      <span class="value-num" id="num-scale">100</span>
    </div>
    <input type="range" min="10" max="110" value="100" id="slider-scale">
  </div>

  <div style="height:24px"></div>
  <p class="controls-title">Valori</p>

  <div id="sliders"></div>
  <div class="controls-footer">
    <button class="primary" onclick="regenerate()">↺ Rigenera forma</button>
    <button class="secondary" onclick="downloadSVG()">↓ Scarica SVG</button>
  </div>
</aside>

<main class="canvas-area">
  <svg id="logo-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <path id="logo-path" fill="#0f0f0f" fill-rule="evenodd"/>
  </svg>

</main>

<script>
  // Values with their angular ranges (degrees, measured from top, counterclockwise)
  const VALUES = [
    { name: "Trasparenza",       minDeg: 25,  maxDeg: 35  },
    { name: "Accoglienza",       minDeg: 85,  maxDeg: 95  },
    { name: "Ludicità",          minDeg: 155, maxDeg: 165 },
    { name: "Responsabilità",    minDeg: 205, maxDeg: 215 },
    { name: "Persona al centro", minDeg: 265, maxDeg: 275 },
    { name: "Innovazione",       minDeg: 325, maxDeg: 335 },
  ];

  const CX = 250, CY = 250;
  const BASE_R = 130;

  // Build sliders
  const slidersEl = document.getElementById('sliders');
  VALUES.forEach((v, i) => {
    const row = document.createElement('div');
    row.className = 'value-row';
    row.innerHTML = `
      <div class="value-label">
        <span class="value-name">${v.name}</span>
        <span class="value-num" id="num-${i}">100</span>
      </div>
      <input type="range" min="1" max="100" value="100" id="slider-${i}">
    `;
    slidersEl.appendChild(row);
    document.getElementById(`slider-${i}`).addEventListener('input', function() {
      document.getElementById(`num-${i}`).textContent = this.value;
      drawLogo();
    });
  });

  document.getElementById('slider-scale').addEventListener('input', function() {
    document.getElementById('num-scale').textContent = this.value;
    renderLogo();
  });

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  // Rotate point (px,py) around (cx,cy) by radians (positive = counterclockwise in SVG coords)
  function rotatePoint(px, py, cx, cy, rad) {
    const cos = Math.cos(rad), sin = Math.sin(rad);
    return [
      cos * (px - cx) - sin * (py - cy) + cx,
      sin * (px - cx) + cos * (py - cy) + cy
    ];
  }

  function getInputs() {
    return VALUES.map((_, i) => parseInt(document.getElementById(`slider-${i}`).value));
  }

  // Compute the 6 inner hexagon vertices
  function computeInnerPoints(inputs) {
    return VALUES.map((v, i) => {
      const input = inputs[i];
      // Random base radius scaled by input
      const baseR = (rand(95, 100) / 100) * (input / 100) * BASE_R;
      // Random angle within the value's range, converted to radians
      const angleDeg = rand(v.minDeg, v.maxDeg);
      const angleRad = angleDeg * Math.PI / 180;
      // Place point: angle is from top, going counterclockwise
      // counterclockwise from top means: x = cx - r*sin(a), y = cy - r*cos(a)
      const x = CX - baseR * Math.sin(angleRad);
      const y = CY - baseR * Math.cos(angleRad);
      return [x, y];
    });
  }

  // Compute the 18 outer points (3 per inner vertex)
  function computeOuterPoints(innerPoints) {
    const outer = [];
    innerPoints.forEach(([px, py]) => {
      // L1: rotate 0.3 rad clockwise around center
      const p1 = rotatePoint(px, py, CX, CY, -0.3);
      // L2: push 20 units away from center
      const dx = px - CX, dy = py - CY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const p2 = [px + (dx / dist) * 20, py + (dy / dist) * 20];
      // L3: rotate 0.3 rad counterclockwise around center
      const p3 = rotatePoint(px, py, CX, CY, 0.3);
      outer.push(p3, p2, p1);
    });
    return outer;
  }

  function ptsToPathData(pts) {
    return pts.map(([x, y], i) =>
      `${i === 0 ? 'M' : 'L'}${x.toFixed(2)},${y.toFixed(2)}`
    ).join(' ') + ' Z';
  }

  // Stored points — only regenerated when values change or regenerate is clicked
  let storedInner = null;
  let storedOuter = null;

  function generatePoints() {
    const inputs = getInputs();
    storedInner = computeInnerPoints(inputs);
    storedOuter = computeOuterPoints(storedInner);
  }

  function renderLogo() {
    const scale = parseInt(document.getElementById('slider-scale').value) / 100;
    const innerScaled = storedInner.map(([x, y]) => {
      const dx = x - CX, dy = y - CY;
      return [CX + dx * scale, CY + dy * scale];
    });
    const outerD = ptsToPathData(storedOuter);
    const innerD = ptsToPathData([...innerScaled].reverse());
    document.getElementById('logo-path').setAttribute('d', outerD + ' ' + innerD);
  }

  function drawLogo() {
    generatePoints();
    renderLogo();
  }

  function regenerate() {
    drawLogo();
  }

  function downloadSVG() {
    const svg = document.getElementById('logo-svg');
    const serializer = new XMLSerializer();
    let svgStr = serializer.serializeToString(svg);
    if (!svgStr.includes('xmlns=')) {
      svgStr = svgStr.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    const blob = new Blob([svgStr], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'logo.svg';
    a.click();
    URL.revokeObjectURL(url);
  }

  drawLogo();
</script>
</body>
</html>
